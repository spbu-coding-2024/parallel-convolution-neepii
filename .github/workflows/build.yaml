name: Build, Check formating, lint

on:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ make libomp-dev clang-format clang-tidy

      - name: Compile
        run: make

      - name: Check Format
        run: ./scripts/check-format.sh

      - name: Lint
        run: ./scripts/lint.sh
